{% extends "base.html" %}

{% block title %}로그인 — SN 매칭 관리 툴{% endblock %}

{% block content %}
<main class="login-container">
    <div class="panel login-panel">
        <div class="section-head text-center">
            <h2>시스템 로그인</h2>
            <p>생산 공정 관리 시스템 접속을 위해 비밀번호를 입력해주세요.</p>
        </div>

        <form id="loginForm" class="form-grid" autocomplete="off" onsubmit="return false;">
            <label class="field">
                <span>비밀번호</span>
                <input id="loginPassword" type="password" placeholder="비밀번호 입력" autofocus required>
            </label>

            <div id="loginMessage" class="inline-message error" style="margin-top: 10px;" hidden></div>

            <div class="button-row" style="margin-top: 20px;">
                <button id="loginButton" class="primary-button" type="submit" style="width: 100%;">로그인</button>
            </div>
        </form>
    </div>
</main>

<style>
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 120px);
    padding: 20px;
}
.login-panel {
    max-width: 420px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
}
.text-center {
    text-align: center;
}
.text-center p {
    margin-top: 8px;
    color: #666;
    font-size: 0.95rem;
}
</style>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const loginForm = document.getElementById("loginForm");
    const loginPassword = document.getElementById("loginPassword");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = loginPassword.value.trim();
        if (!password) return;

        loginButton.disabled = true;
        if (loginMessage) loginMessage.hidden = true;

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });
            const data = await response.json();

            if (response.ok) {
                window.location.href = "/";
            } else {
                if (loginMessage) {
                    loginMessage.textContent = data.message || "비밀번호가 올바르지 않습니다.";
                    loginMessage.hidden = false;
                }
                loginPassword.focus();
                loginPassword.select();
            }
        } catch (error) {
            if (loginMessage) {
                loginMessage.textContent = "통신 중 오류가 발생했습니다.";
                loginMessage.hidden = false;
            }
        } finally {
            loginButton.disabled = false;
        }
    });
});
</script>
{% endblock %}
